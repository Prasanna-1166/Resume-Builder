<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle glow circles -->
  <circle cx="200" cy="150" r="300" fill="#4F46E5" fill-opacity="0.15" filter="blur(60px)" />
  <circle cx="1000" cy="450" r="350" fill="#0284C7" fill-opacity="0.15" filter="blur(70px)" />

  <!-- Brand Header -->
  <g transform="translate(100, 80)">
    <rect width="52" height="52" rx="14" fill="#4F46E5" />
    <path d="M18 16H34M18 24H34M18 32H28" stroke="white" stroke-width="3" stroke-linecap="round" />
    <text x="68" y="36" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="800" fill="white">
      CareerDoc<tspan fill="#818CF8">AI</tspan>
    </text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="220" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="900" fill="white" letter-spacing="-1">
    Free AI Resume Builder &amp;
  </text>
  <text x="100" y="285" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="900" fill="url(#accentGrad)" letter-spacing="-1">
    ATS Score Checker
  </text>

  <!-- Description -->
  <text x="100" y="355" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">
    Build professional, ATS-optimized resumes in minutes for free.
  </text>
  <text x="100" y="390" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">
    38 verified templates • Real-time ATS auditor • Instant PDF &amp; Word download.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 450)">
    <!-- Pill 1 -->
    <rect width="210" height="48" rx="24" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="30" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#F8FAFC">
      ✓ 100% Free Forever
    </text>

    <!-- Pill 2 -->
    <g transform="translate(230, 0)">
      <rect width="230" height="48" rx="24" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="30" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#F8FAFC">
        ✓ 38 ATS Templates
      </text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(480, 0)">
      <rect width="240" height="48" rx="24" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="30" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#F8FAFC">
        ✓ Local Browser Privacy
      </text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(740, 0)">
      <rect width="220" height="48" rx="24" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="30" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#F8FAFC">
        ✓ PDF &amp; DOCX Export
      </text>
    </g>
  </g>

  <!-- Domain Badge -->
  <g transform="translate(100, 545)">
    <text x="0" y="20" font-family="Fira Code, monospace" font-size="18" font-weight="500" fill="#64748B">
      https://dvlpr.dpdns.org
    </text>
  </g>
</svg>

